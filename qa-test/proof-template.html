<title>{{TITLE}} Agent Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of test cases, design and staging screenshot side by side */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1b1f27; --muted: #5d6573; --line: #dde1e8;
  --pass: #1d7a4a; --pass-bg: #e3f4ea; --fail: #b4232c; --fail-bg: #fbe6e7; --accent: #3446c9;
  --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1b1f27; --fg: #e8eaef; --muted: #9aa2b1; --line: #2c323d;
  --pass: #6fd3a0; --pass-bg: #173326; --fail: #f2868c; --fail-bg: #3a1a1d; --accent: #8f9cff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1b1f27; --fg: #e8eaef; --muted: #9aa2b1; --line: #2c323d;
  --pass: #6fd3a0; --pass-bg: #173326; --fail: #f2868c; --fail-bg: #3a1a1d; --accent: #8f9cff; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; }
main { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; text-wrap: balance; }
.intro { color: var(--muted); margin: 0; max-width: 70ch; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.summary button { font: 500 14px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.summary button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.summary button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { color: var(--muted); font-size: 14px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 16px; }
.case[data-result="FAIL"] { border-color: var(--fail); }
.case:target { outline: 2px solid var(--accent); outline-offset: 2px; }
.case header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row { font: 500 13px var(--mono); color: var(--muted); }
.pill { font: 500 12px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; }
.pill.pass { background: var(--pass-bg); color: var(--pass); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.where { font-size: 13px; color: var(--muted); }
.label { margin: 0; font-weight: 600; }
.expected { margin: 0; white-space: pre-line; max-width: 75ch; }
.notes { margin: 0; color: var(--muted); font-size: 14px; }
.case[data-result="FAIL"] .notes { color: var(--fail); }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 4px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
figcaption { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
figure img { display: block; width: 100%; max-height: 520px; object-fit: contain; object-position: top left; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
</style>
<main>
  <h1>{{TITLE}}: agent QA pass</h1>
  <p class="intro">An agent ran this QA sheet on staging. Each tested row shows the expected behaviour, the design and a staging screenshot. Skipped rows are listed in the sheet with a reason.</p>
  <div class="summary" role="group" aria-label="Filter results">
    <button id="filter-all" data-filter="ALL" aria-pressed="true">All tested {{TESTED}}</button>
    <button id="filter-fail" data-filter="FAIL" aria-pressed="false">Fail {{FAIL}}</button>
    <button id="filter-pass" data-filter="PASS" aria-pressed="false">Pass {{PASS}}</button>
    <span class="skip">{{SKIP}} skipped, not shown</span>
  </div>
  {{CARDS}}
</main>
<script>
const buttons = document.querySelectorAll(".summary button");
buttons.forEach(button => button.addEventListener("click", () => {
  buttons.forEach(other => other.setAttribute("aria-pressed", String(other === button)));
  document.querySelectorAll(".case").forEach(card => {
    card.hidden = button.dataset.filter !== "ALL" && card.dataset.result !== button.dataset.filter;
  });
}));
function showHash() {
  const target = location.hash && document.getElementById(location.hash.slice(1));
  if (target) { target.hidden = false; target.scrollIntoView(); }
}
window.addEventListener("hashchange", showHash);
showHash();
</script>
